<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>Patrick San · Reservas e Cursos</title>
<meta name="description" content="Sushiman, mergulhador e pescador artesanal em Cananéia. Reserve sua mesa no Restaurante Bacharel ou aprenda nos cursos do Chef Patrick San.">
<meta property="og:title" content="Patrick San · Reservas e Cursos">
<meta property="og:description" content="Sushiman, mergulhador e pescador artesanal em Cananéia.">
<meta property="og:image" content="https://i.imgur.com/h0Y1D2h.jpeg">
<meta name="theme-color" content="#0b0b09">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /*
    VOZ: a mesma das duas páginas de destino, sóbria e escura
    IDEIA: uma porta de entrada; cada cartão já tem a cara da página aonde leva
    FOTO: as duas fotos vão embutidas neste arquivo, sem depender de outro site
    COR E LETRA: preto quente, âmbar das reservas, areia dos cursos; Playfair, Cormorant e Inter
    LAYOUT: uma coluna estreita, pensada para o celular
  */
  :root {
    color-scheme: dark;
    --bg: #0b0b09;
    --ink: #f3efe7;
    --muted: #a39d92;
    --amber: #d4872a;   /* cor da página de reservas */
    --sand: #c4a87a;    /* cor da página de cursos */
    --line: rgba(196, 168, 122, .28);
  }
  * { box-sizing: border-box; margin: 0; min-width: 0; }
  html, body { background: var(--bg); }
  body {
    font: 16px/1.55 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    overflow-x: clip;
  }
  .wrap { max-width: 460px; margin: 0 auto; padding: 0 18px 44px; }

  /* topo: só o nome, como na página de reservas */
  header { text-align: center; padding: 54px 6px 30px; }
  .marca {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 700;
    font-size: clamp(2.4rem, 11vw, 2.9rem);
    line-height: 1.05;
    letter-spacing: -.01em;
  }
  .marca span { color: var(--amber); }
  .quem {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-style: italic; font-weight: 500;
    font-size: 1.25rem; line-height: 1.35;
    color: var(--sand);
    margin-top: 10px;
  }
  .onde {
    margin-top: 14px;
    font-size: .72rem; font-weight: 500;
    letter-spacing: .16em; text-transform: uppercase;
    color: var(--muted);
  }
  .fio { width: 44px; height: 1px; background: var(--line); margin: 26px auto 0; border: 0; }

  /* os cartões principais */
  nav.main { display: grid; gap: 16px; }
  .card {
    position: relative;
    display: flex; align-items: flex-end;
    min-height: 236px;
    overflow: hidden;
    text-decoration: none; color: var(--ink);
    background: #151410;
    border: 1px solid rgba(243, 239, 231, .12);
    transition: transform .25s ease, border-color .25s ease;
  }
  .card img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    transition: transform .6s ease;
  }
  .card::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(11,11,9,.96) 12%, rgba(11,11,9,.55) 52%, rgba(11,11,9,.05) 100%);
  }
  .card:hover { transform: translateY(-3px); }
  .card:hover img { transform: scale(1.04); }
  .card:focus-visible, .small a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .txt { position: relative; z-index: 1; padding: 20px 20px 22px; width: 100%; }
  .card h2 {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 600;
    font-size: 1.85rem; line-height: 1.08;
  }
  .card p { font-size: .93rem; color: #d9d3c8; margin-top: 5px; }
  .go {
    display: inline-block; margin-top: 16px;
    padding: 12px 22px;
    font-size: .76rem; font-weight: 600;
    letter-spacing: .14em; text-transform: uppercase;
    color: #0b0b09;
  }

  /* reservas: âmbar e botão redondo, igual à página de reservas */
  .reservas { border-radius: 20px; }
  .reservas img { object-position: center 35%; }
  .reservas .go { background: var(--amber); border-radius: 999px; box-shadow: 0 6px 22px rgba(212,135,42,.32); }
  .reservas:hover { border-color: rgba(212,135,42,.7); }

  /* cursos: areia e botão reto, igual à página de cursos */
  .cursos { border-radius: 4px; }
  .cursos img { object-position: 30% 35%; }
  .cursos .go { background: var(--sand); border-radius: 0; }
  .cursos:hover { border-color: rgba(196,168,122,.7); }

  /* passeios (quando existir) */
  .roteiros { border-radius: 12px; }
  .roteiros .go { background: var(--ink); border-radius: 999px; }

  /* links menores */
  .small { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; }
  .small a {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 48px; padding: 12px 10px;
    text-decoration: none; color: var(--ink);
    border: 1px solid var(--line); border-radius: 999px;
    font-size: .76rem; font-weight: 600;
    letter-spacing: .14em; text-transform: uppercase;
    transition: background .2s ease, border-color .2s ease;
  }
  .small a:hover { background: rgba(196,168,122,.1); border-color: var(--sand); }
  .small svg { width: 16px; height: 16px; flex: none; fill: currentColor; }

  footer {
    text-align: center; margin-top: 36px;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-style: italic; font-size: 1.05rem; color: var(--muted);
  }

  @media (prefers-reduced-motion: reduce) {
    .card, .card img { transition: none; }
    .card:hover, .card:hover img { transform: none; }
  }
</style>
</head>
